# Application Configuration
spring.application.name=assessment

# Server Configuration
server.port=8080

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:leanin;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# SQL Initialization
spring.sql.init.mode=always

# H2 Console (Local Development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false

# Recommendation Configuration
recommendations.default-limit=10
recommendations.max-limit=20
recommendations.inactive-days=60
